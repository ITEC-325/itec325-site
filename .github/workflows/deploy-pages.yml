name: CI and Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify files exist
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f script.js
          echo "All required files found."

      - name: Basic HTML checks
        run: |
          set -euo pipefail
          echo "Checking title and basic tags in index.html..."
          grep -q "<title>My Demo Site</title>" index.html
          grep -q "<h1>Welcome to My Demo Site</h1>" index.html
          grep -q "script.js" index.html
          echo "HTML looks good."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4